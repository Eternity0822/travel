{% extends 'base.html' %}
{% block content %}
    {% load static %}
    <style>
        .profile-grid {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 24px;
        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
            padding: 24px;
            flex: 1 1 380px;
            min-width: 320px;
        }

        .profile-card .section-title {
            margin-bottom: 18px;
            font-size: 18px;
            font-weight: 700;
            color: #1f2a37;
        }

        .avatar-preview-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid #d9e2ef;
        }

        .avatar-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #6b7280;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            pointer-events: none;
        }

        .avatar-actions {
            text-align: center;
        }

        .avatar-upload-btn {
            margin-top: 12px;
            background: #2f80ed;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            cursor: pointer;
        }

        .avatar-upload-btn:hover {
            opacity: 0.95;
        }

        .file-hint {
            margin-top: 10px;
            font-size: 13px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #344054;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f8fafc;
        }

        .btn-primary {
            background: #2f80ed;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            cursor: pointer;
        }

        .btn-primary:hover {
            opacity: 0.95;
        }

        @media (max-width: 992px) {
            .profile-grid {
                flex-direction: column;
            }
        }
    </style>
    <!-- Page-header start -->
    <div class="page-header">
                            <div class="page-block">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <div class="page-header-title">
                                            <h5 class="m-b-10">个人信息管理</h5>
                                            <p class="m-b-0">个人信息</p>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <ul class="breadcrumb-title">
                                            <li class="breadcrumb-item">
                                                <a href="{% url 'home:index' %}"> <i class="fa fa-home"></i> </a>
                                            </li>
                                            <li class="breadcrumb-item"><a href="#!">个人中心</a>
                                            </li>
                                            <li class="breadcrumb-item"><a href="#!">个人信息管理</a>
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
    </div>
    <!-- Page-header end -->
    <div class="pcoded-inner-content">
                            <!-- Main-body start -->
                            <div class="main-body">
                                <div class="page-wrapper">
                                    <div class="page-body">
                                        <div class="profile-container">
                                            <!-- 消息提示 -->
                                            {% if success %}
                                                <div class="alert alert-success">
                                                    <i class="fa fa-check-circle"></i>{{ success }}
                                                </div>
                                            {% endif %}

                                            {% if error %}
                                                <div class="alert alert-error">
                                                    <i class="fa fa-exclamation-circle"></i>{{ error }}
                                                </div>
                                            {% endif %}

                                            <div class="profile-grid">
                                                    <!-- 头像上传区域 -->
                                                    <div class="profile-card">
                                                        <h3 class="section-title">个人头像</h3>
                                                        <div class="avatar-preview-wrapper">
                                                            <img id="avatarPreview"
                                                                src="{% if user.avatar %}{{ user.avatar }}{% else %}{% static 'assets/images/default-avatar.png' %}{% endif %}"
                                                                alt="头像" class="avatar-preview">
                                                            {% if not user.avatar %}
                                                                <div class="avatar-placeholder">头像预览</div>
                                                            {% endif %}
                                                        </div>
                                                        <div class="avatar-actions">
                                                            <input type="file" id="avatarInput" class="avatar-input" accept="image/*" style="display:none;">
                                                            <button type="button" class="avatar-upload-btn"
                                                                    onclick="document.getElementById('avatarInput').click()">
                                                                <i class="fa fa-camera"></i> 上传头像
                                                            </button>
                                                            <p class="file-hint">
                                                                支持的文件格式：JPG、PNG、GIF。大小不超过 2MB。
                                                            </p>
                                                        </div>
                                                    </div>

                                                    <!-- 个人信息表单 -->
                                                    <div class="profile-card">
                                                        <h3 class="section-title">基本信息</h3>
                                                        <form id="profileForm" method="post">
                                                            {% csrf_token %}
                                                            <div class="form-group">
                                                                <label class="form-label">用户名</label>
                                                                <input type="text" class="form-control" name="username" value="{{ user.username }}" required>
                                                            </div>
                                                            <div class="form-group">
                                                                <label class="form-label">电子邮箱</label>
                                                                <input type="email" class="form-control" name="email" value="{{ user.uemail }}" required>
                                                            </div>
                                                            <div class="form-group">
                                                                <label class="form-label">手机号码</label>
                                                                <input type="tel" class="form-control" name="phone" value="{{ user.uphone }}" required>
                                                            </div>
                                                            <div class="form-group">
                                                                <label class="form-label">地址</label>
                                                                <input type="text" class="form-control" name="address" value="{{ user.uaddress }}" required>
                                                            </div>
                                                            <div class="form-group">
                                                                <label class="form-label">邮编</label>
                                                                <input type="text" class="form-control" name="youbian" value="{{ user.uyoubian }}" required>
                                                            </div>
                                                            <div class="form-group">
                                                                <button type="submit" class="btn-primary">
                                                                    <i class="fa fa-save"></i> 保存修改
                                                                </button>
                                                            </div>
                                                        </form>
                                                    </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="styleSelector">

                            </div>
    </div>

    <script type="text/javascript" src="{% static 'assets/js/jquery/jquery.min.js' %}"></script>
    <script>
        $(document).ready(function() {
            // 头像上传处理（移除有问题的消息显示代码）
            $('#avatarInput').on('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                // 预览图片
                const reader = new FileReader();
                reader.onload = function(e) {
                    $('#avatarPreview').attr('src', e.target.result);
                    $('.avatar-placeholder').hide();
                };
                reader.readAsDataURL(file);

                // 上传文件
                const formData = new FormData();
                formData.append('avatar', file);
                formData.append('csrfmiddlewaretoken', '{{ csrf_token }}'); // 或采用 headers 方式

                $.ajax({
                    url: '{% url "user:upload_avatar" %}',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        alert('头像上传成功！');
                        // 可选：更新头像为服务器返回的永久 URL
                        if (response.avatar_url) {
                            $('#avatarPreview').attr('src', response.avatar_url);
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('上传失败:', error);
                        alert('头像上传失败，请重试！');
                    }
                });
            });
        });
    </script>
{% endblock %}
